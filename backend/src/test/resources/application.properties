# Test-only values. Never reuse real secrets here.
spring.datasource.password=unused-testcontainers-overrides
intellhub.identity.jwt.secret=test-only-secret-test-only-secret-0123456789
intellhub.identity.bcrypt-strength=4
intellhub.sources.seed-defaults=false
spring.jpa.properties.hibernate.generate_statistics=true
intellhub.enrichment.seed-taxonomy=false
# Tests never reach a real provider, whatever a developer put in .env: enrichment is off unless a test turns it on.
intellhub.enrichment.provider=
