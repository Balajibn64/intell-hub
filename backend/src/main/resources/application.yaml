spring:
  application:
    name: intellhub
  config:
    # Local convenience: read the repo-root .env (ignored by git) when running from backend/ or
    # the repo root. Real environment variables take precedence over this file.
    import: "optional:file:../.env[.properties],optional:file:./.env[.properties]"
  datasource:
    # Same variables as compose.yaml, so changing DB_PORT or DB_NAME there keeps the app in sync.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:intellhub}}
    username: ${DB_USER:intellhub}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes go through Flyway only. Hibernate just checks the mapping.
      ddl-auto: validate

intellhub:
  identity:
    jwt:
      # Required, at least 32 characters. Startup fails if it is missing or too short.
      secret: ${JWT_SECRET}
    refresh:
      cookie-secure: ${COOKIE_SECURE:false}
    admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173}

  ingestion:
    # Shared secret for POST /internal/ingest (at least 32 characters). Unset means the endpoint refuses every call.
    ingest-secret: ${INGEST_SECRET:}
    # Run ingestion inside the app on a schedule. Off by default; an external cron can call the endpoint instead.
    schedule-enabled: ${INGEST_SCHEDULE_ENABLED:false}
    cron: "${INGEST_CRON:0 0 */4 * * *}"

  enrichment:
    # Which provider summarizes and tags articles. Unset (the default) turns enrichment off: articles stay
    # pending and the feed shows them as not yet summarized. Only "fake" exists until the real providers arrive.
    provider: ${ENRICHMENT_PROVIDER:}
    # Provider calls per day across all providers, and how many of those only a reader's request may use.
    daily-budget: ${ENRICHMENT_DAILY_BUDGET:250}
    reserved-calls: ${ENRICHMENT_RESERVED_CALLS:50}
    # The time zone whose midnight starts a new day of budget.
    budget-zone: ${ENRICHMENT_BUDGET_ZONE:UTC}

  sources:
    # Adds the starter feeds from default-sources.json, only while there are no sources at all.
    seed-defaults: ${SEED_DEFAULT_SOURCES:true}

management:
  endpoints:
    web:
      exposure:
        include: health
