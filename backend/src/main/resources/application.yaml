spring:
  application:
    name: intellhub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/intellhub}
    username: ${DB_USER:intellhub}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      # Schema changes go through Flyway only. Hibernate just checks the mapping.
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health
