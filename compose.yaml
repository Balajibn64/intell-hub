services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-intellhub}
      POSTGRES_USER: ${DB_USER:-intellhub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-intellhub} -d ${DB_NAME:-intellhub}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
